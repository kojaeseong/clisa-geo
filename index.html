<style>
:root{
  --focus-0:#E8EEF5; --focus-1:#1B4F8A;
  --bg:#EBEEF2; --panel:#FFFFFF; --panel-2:#F3F5F8; --ink:#0E1726; --ink-2:#344054; --muted:#667085; --line:#D3DAE3;
  --ocean:#D9E3EE; --ocean-2:#C4D3E3; --grat:rgba(20,50,90,.11); --land-out:#E3E7EC; --border:rgba(14,23,38,.34);
  --accent:#1B4F8A; --accent-soft:rgba(27,79,138,.08); --l1:#3E5C76; --l2:#1B4F8A; --l3:#7A4E9E; --coop:#11796B; --conflict:#B42318; --halo:#FFFFFF;
  --d-geo:#2a78d6; --d-power:#eb6834; --d-regime:#1baf7a; --d-memory:#eda100; --d-deal:#8a63d2; --risk-0:#F6E6E1; --risk-1:#9C2217; --mil-0:#DDE5ED; --mil-1:#1C4A77; --pol-0:#E1EBDD; --pol-1:#2B6535; --econ-0:#F1E7CF; --econ-1:#81530F;
  --serif:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:14px/1.6 var(--sans); -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible+span,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a{color:var(--accent)}

.app{height:100%; display:grid; grid-template-rows:auto 1fr; padding-inline:16px; padding-block:0 16px; gap:12px}
.top{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding-top:14px}
.brand{display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap; margin-right:auto}
.brand h1{margin:0; font:800 21px/1 "Archivo",var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
.brand .logo{width:28px; height:28px; flex:none}
.brand .ko{font:500 12px var(--sans); color:var(--muted)}
.edtag{font:600 11px var(--sans); color:var(--conflict); border:1px solid var(--conflict); border-radius:4px; padding:1px 6px}
.brand .en{font:500 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.asof{font:12px var(--mono); color:var(--muted)}
.asof b{color:var(--ink-2); font-weight:500}
.seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:6px; cursor:pointer; color:var(--ink-2); font-size:13px; white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink); color:var(--panel); font-weight:600}
.toggles{display:flex; gap:8px}
.tg{position:relative; display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none}
.tg input{position:absolute; opacity:0; width:1px; height:1px}
.tg span{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel)}
.tg span::before{content:""; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--muted)}
.tg input:checked+span::before{background:var(--accent); border-color:var(--accent)}

.stage{display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:12px; min-height:0}
.globe-wrap{position:relative; min-height:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:
  radial-gradient(120% 90% at 50% 45%, var(--panel-2), var(--bg))}
.globe-wrap canvas{position:absolute; inset:0; width:100%; height:100%}
#over{cursor:grab; touch-action:none}
#over:active{cursor:grabbing}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px}
.readout{position:absolute; top:12px; right:12px; font:11px/1 var(--mono); color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-variant-numeric:tabular-nums}
.ctl{position:absolute; top:12px; left:12px; display:flex; flex-direction:column; gap:4px}
.ctl button{width:32px; height:32px; border-radius:6px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font:500 16px/1 var(--mono); color:var(--ink-2)}
.ctl button:hover{border-color:var(--ink-2)}
.legend{position:absolute; left:12px; bottom:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:236px; display:grid; gap:8px}
.legend .lt{font-weight:600; font-size:12px}
.legend .ld{font-size:11px; color:var(--muted); line-height:1.4}
.ramp{height:8px; border-radius:2px}
.ticks{display:flex; justify-content:space-between; font:10px var(--mono); color:var(--muted); margin-top:-4px}
.keys{display:grid; gap:4px; font-size:11px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:8px}
.keys div{display:flex; align-items:center; gap:8px}
.keys svg{flex:none}
.offmap{position:absolute; right:12px; bottom:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100% - 270px)}
.offmap .lbl{font-size:11px; color:var(--muted)}
.lensbar{position:absolute; top:12px; left:56px; right:auto; display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--panel); border-radius:6px; padding:6px 8px 6px 12px; font-size:12px; max-width:calc(100% - 200px)}
.lensbar button{border:0; background:transparent; color:inherit; text-decoration:underline; cursor:pointer; font-size:12px}
.tip{position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12px; line-height:1.45; max-width:240px; box-shadow:0 6px 18px rgba(0,0,0,.14); z-index:5}
.tip b{font-size:13px}
.tip .m{color:var(--muted)}
.tip .num{font-family:var(--mono)}

.panel{min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tabs{display:flex; border-bottom:1px solid var(--line); padding:0 8px; gap:2px; overflow-x:auto; flex:none}
.tabs button{border:0; background:transparent; padding:12px 10px 10px; cursor:pointer; color:var(--muted); font-size:13px; border-bottom:2px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.pane{overflow-y:auto; padding:18px 18px 28px; display:grid; gap:24px; align-content:start; min-height:0; flex:1}
.pane h2{margin:0; font:700 21px/1.3 var(--serif); letter-spacing:-.015em; text-wrap:balance}
.pane h3{margin:0 0 10px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em}
.pane p{margin:0}
.eyebrow{font-size:12px; color:var(--accent); font-weight:600; letter-spacing:.03em}
.lead{color:var(--ink-2)}
.sec{display:grid; gap:0}
.list{display:grid; gap:0; margin:0; padding:0; list-style:none}
.list>li{border-top:1px solid var(--line); padding:12px 0}
.list>li:first-child{border-top:0; padding-top:0}
.row-btn{display:grid; width:100%; text-align:left; border:0; background:transparent; padding:0; cursor:pointer; gap:4px}
.row-btn:hover .nm{text-decoration:underline; text-decoration-color:var(--accent)}
.nm{font-weight:600}
.meta{font-size:12px; color:var(--muted)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2); color:var(--ink)}
.chip.t1{font-weight:600; color:var(--ink)}
.chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
.pips{display:inline-flex; gap:2px; vertical-align:middle}
.pips i{width:8px; height:8px; border-radius:1px; background:var(--line)}
.pips i.on{background:var(--conflict)}
.fp-head{display:flex; align-items:center; gap:8px; justify-content:space-between}
.bars{display:grid; gap:6px}
.bar{display:grid; grid-template-columns:96px 1fr 30px; align-items:center; gap:10px; font-size:13px; cursor:pointer; border:0; background:transparent; padding:2px 0; text-align:left}
.bar:hover span:first-child{text-decoration:underline; text-decoration-color:var(--accent)}
.bar .track{height:8px; background:var(--panel-2); border-radius:2px; overflow:hidden}
.bar .fill{height:100%; border-radius:0 4px 4px 0}
.bar .v{font:12px var(--mono); text-align:right; color:var(--ink-2)}
.digest{display:grid; gap:16px; counter-reset:none}
.digest article{display:grid; gap:4px}
.digest .h{font-weight:600; font-size:14px; line-height:1.45}
.digest p{color:var(--ink-2); font-size:13px}
.lead-q{font:600 15px/1.6 var(--serif); color:var(--ink-2)}

.scores{display:grid; gap:8px}
.score{display:grid; grid-template-columns:76px 1fr 30px; gap:10px; align-items:center; font-size:13px}
.figs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.figs div{background:var(--panel); padding:10px 12px; display:grid; gap:2px}
.figs dt{font-size:11px; color:var(--muted)}
.figs dd{margin:0; font:500 15px var(--mono); font-variant-numeric:tabular-nums}
.figs dd small{font:11px var(--sans); color:var(--muted); margin-left:4px}
.note{font-size:12px; color:var(--muted); line-height:1.5}
.kv{display:grid; grid-template-columns:84px 1fr; gap:6px 12px; font-size:13px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tl{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.tl li{display:grid; grid-template-columns:78px 1fr; gap:10px; font-size:13px}
.tl .d{font:11px/1.9 var(--mono); color:var(--muted)}
.watch{margin:0; padding-left:18px; display:grid; gap:4px; font-size:13px}
details.src summary{cursor:pointer; font-size:12px; color:var(--muted)}
details.src ul{margin:8px 0 0; padding-left:18px; font-size:12px; display:grid; gap:4px; word-break:break-all}

.fc{display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:start}
.fc .q{font-weight:600; line-height:1.5}
.fc .p{font:500 22px/1 var(--mono); text-align:right; font-variant-numeric:tabular-nums}
.fc .p small{font-size:12px; color:var(--muted)}
.fc .b{grid-column:1/-1; font-size:12px; color:var(--ink-2)}
.fc .foot{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12px; color:var(--muted)}
.st{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--line)}
.st.open{color:var(--ink-2)}
.st.yes{color:var(--coop); border-color:var(--coop)}
.st.no{color:var(--conflict); border-color:var(--conflict)}
/* v3.0 */ .st.void{color:var(--ink-3,#888); border-color:var(--l3); text-decoration:line-through}
.fc .vr{font-size:12px; color:var(--ink-2); margin-top:4px}
.aiprec{display:grid; gap:6px}
/* v3.7 */ .dv dd,.dv dt{overflow-wrap:anywhere} .divs > *, .futs > *, .fut > *, .stp > *, .full-body > *, .pane > *, article.sec > *{min-width:0}
/* v3.5 */ .theo .tl-w{font-size:12.5px; color:var(--ink-2)} .theo .kd{font:600 10.5px var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-right:6px} .aiprec .dv dl{margin-top:4px}
.trend .pn{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.prob{height:4px; background:var(--panel-2); border-radius:2px; grid-column:1/-1; overflow:hidden}
.prob i{display:block; height:100%; background:var(--accent)}
.score-card{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.score-card div{padding:10px 12px; display:grid; gap:2px; border-left:1px solid var(--line)}
.score-card div:first-child{border-left:0}
.score-card b{font:500 18px var(--mono)}
.score-card span{font-size:11px; color:var(--muted)}

.thinker{display:grid; gap:10px; padding-bottom:4px}
.thinker .who{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.thinker .who h4{margin:0; font:700 18px var(--serif)}
.thinker .works{font-size:12px; color:var(--muted)}
.thinker dl{margin:0; display:grid; gap:8px}
.thinker dt{font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.03em}
.thinker dd{margin:0; font-size:13px; color:var(--ink-2)}
.lens-btn{justify-self:start; border:1px solid var(--ink-2); background:transparent; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer}
.lens-btn[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.empty{display:grid; gap:14px}
.region h4{margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600}
.method li{margin-bottom:4px}
.method ul{margin:0; padding-left:18px; font-size:13px; color:var(--ink-2)}

.gs{display:grid; gap:12px}
.gs-core{font:600 15px/1.65 var(--serif); color:var(--ink); border-left:3px solid var(--accent); padding-left:12px}
.gs-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.gs-box{border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:6px; align-content:start}
.gs-box.wide{grid-column:1/-1}
.gs-box h5{margin:0; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px}
.gs-box h5 i{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.gs-box.give h5 i{background:var(--coop)}
.gs-box.never h5 i{background:var(--conflict)}
.gs-box.goal h5 i{background:var(--accent)}
.gs-box ul{margin:0; padding-left:16px; font-size:13px; display:grid; gap:3px; color:var(--ink-2)}
.gs p{font-size:13px; color:var(--ink-2)}
.mx-wrap{overflow-x:auto}
.mx{border-collapse:separate; border-spacing:2px; font-size:11px; margin:0 auto}
.mx th{font-weight:500; color:var(--muted); padding:2px; white-space:nowrap}
.mx thead th{text-align:center; font-weight:600; color:var(--ink-2)}
.mx tbody th{text-align:right; padding-right:6px}
.mx td{width:30px; height:28px; padding:0}
.mx td button{width:100%; height:100%; border:0; border-radius:3px; cursor:pointer; font:500 11px var(--mono); font-variant-numeric:tabular-nums}
.mx td button.sel{outline:2px solid var(--accent); outline-offset:1px}
.mx td.diag{background:transparent}
.mx-key{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; color:var(--muted); justify-content:center; margin-top:8px}
.mx-key span{display:inline-flex; align-items:center; gap:4px}
.mx-key i{width:12px; height:12px; border-radius:2px; display:inline-block}
.dyad{border:1px solid var(--line); border-radius:8px; padding:12px; display:grid; gap:8px; background:var(--panel)}
.dyad .pair{font:700 16px var(--serif)}
.dyad .cols{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.dyad h5{margin:0 0 4px; font-size:11px; font-weight:600}
.dyad h5.c{color:var(--coop)} .dyad h5.x{color:var(--conflict)}
.dyad ul{margin:0; padding-left:16px; font-size:12px; color:var(--ink-2); display:grid; gap:2px}
.dyad p{font-size:13px; color:var(--ink-2)}
details.dy{border-top:1px solid var(--line); padding:10px 0}
details.dy summary{cursor:pointer; font-weight:600; font-size:13px; list-style-position:outside}
details.dy .dyad{margin-top:8px; border:0; padding:0}
.scn{display:grid; gap:8px}
.scn-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.scn-h b{font:700 17px var(--serif)}
.scn-h .p{font:500 22px var(--mono)}
.scn ul{margin:0; padding-left:16px; font-size:12px; color:var(--ink-2); display:grid; gap:2px}
.scn .kr{font-size:12px; color:var(--ink); background:var(--accent-soft); border-radius:6px; padding:8px 10px}
.trend b{display:block; font-size:14px; margin-bottom:2px}
.trend p{font-size:13px; color:var(--ink-2)}
.hist{display:grid; gap:10px}
.hist-mean{font:600 15px/1.65 var(--serif); color:var(--ink)}
.hist .tl .d{font-size:11px}
.lesson{display:grid; gap:4px; border-left:3px solid var(--line); padding-left:12px}
.lesson b{font-size:12px; color:var(--accent)}
.lesson p{font-size:13px; color:var(--ink-2)}
.an{display:grid; gap:10px}
.an h4{margin:0; font:700 17px/1.35 var(--serif)}
.an .tags{display:flex; flex-wrap:wrap; gap:6px}
.an .tag{font-size:11px; border:1px solid var(--accent); color:var(--accent); border-radius:4px; padding:1px 8px}
.an dl{margin:0; display:grid; gap:8px}
.an dt{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.03em}
.an dd{margin:0; font-size:13px; color:var(--ink-2)}
.an dd.imp{color:var(--ink)}
.an dt.brk{color:var(--conflict)}
.law{display:grid; gap:4px}
.law b{font:700 15px var(--serif)}
.law p{font-size:13px; color:var(--ink-2)}
.drv{display:flex; height:12px; gap:2px; border-radius:3px; overflow:hidden}

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = () => matchMedia("(max-width: 960px)").matches;
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const LAYERS = {
  focus:{label:"분석 대상 지역", desc:"짙을수록 해당 국가가 관련된 전략 분석과 전망이 많다."},
  risk:{label:"위험도", desc:"판단 점수. 높을수록 무력 충돌이나 체제 불안의 위험이 크다."},
  mil:{label:"군사력", desc:"판단 점수. 세계 기준(미국 = 100)의 상대적 군사 능력."},
  pol:{label:"정치 안정", desc:"판단 점수. 높을수록 정권과 정책 방향이 안정적이다."},
  econ:{label:"경제 비중", desc:"판단 점수. 경제 규모와 충격에 대한 회복력."}
};
const JLAYERS = ["risk", "mil", "pol", "econ"];
const TAB_ALIAS = {philo:"method", shelf:"method", history:"method", exit:"strat"};
let FOCUS = {}, FCN = {};
const LENS_NAME = {mackinder:"매킨더의 심장지대", spykman:"스파이크먼의 림랜드", mao:"마오의 지구전", kissinger:"키신저의 삼각외교", lky:"리콴유의 균형론", brzezinski:"브레진스키의 반패권 연합", allison:"앨리슨의 투키디데스 함정"};
const LABEL_AT = {USA:[-98,39], CAN:[-100,58], FRA:[2.5,46.6], NOR:[9,61.5], ESP:[-3.7,40.3], NLD:[5.5,52.2], DNK:[9.3,56], CHL:[-71,-33], RUS:[98,62], AUS:[134,-25], CHN:[103,34], IND:[79,22], KAZ:[67,48], MNG:[103,46.5], IRN:[54,32.5], SAU:[45,24], TUR:[35,39], PAK:[69,29.5], IDN:[114,-1.5], PHL:[122.5,12], VNM:[106.3,15.5], TWN:[121,23.7], JPN:[138.5,36.8], KOR:[127.9,36.3], PRK:[126.8,40.3], UKR:[31.5,49], BLR:[28,53.5], ISR:[34.9,31.2]};
const HOME = [-95, -28, 0], HOME_K = 1;
const REGIONS = ["동아시아","동남아시아","남아시아","중앙아시아·내륙","러시아·동유럽","캅카스·아나톨리아","중동·북아프리카","유럽","북미","중남미","아프리카","오세아니아"];

const S = { layer: store.get("ep.layer2") || "focus", prevTab: "overview", showFp:true, showEdge:true, sel:null, selFp:null, lens:null, hover:null, hoverFp:null, rot:HOME.slice(), k:HOME_K, tab:"overview", scase: null };
if (!LAYERS[S.layer]) S.layer = "focus";
let D = null, features = [], byIso = {}, borders = null, C = {}, labelPos = {};
const grat = d3.geoGraticule10();
const wrap = $("#wrap"), base = $("#base"), over = $("#over");
const bctx = base.getContext("2d"), octx = over.getContext("2d");

let W = 0, H = 0, R0 = 1, dpr = 1, dragging = false;

/* ---------- colours ---------- */
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue("--" + n).trim();
  C = { ocean:g("ocean"), ocean2:g("ocean-2"), grat:g("grat"), landOut:g("land-out"), border:g("border"), ink:g("ink"), muted:g("muted"),

}
const ramp = (layer, v) => C[layer](Math.max(0, Math.min(100, v)) / 100);

/* ---------- formatting ---------- */
function fmtUsdBn(bn){

  const eok = Math.round(bn * 10);
  if (eok >= 10000) { const jo = Math.floor(eok / 10000), r = eok % 10000; return jo + "조" + (r ? " " + r.toLocaleString("ko-KR") + "억" : "") + " 달러"; }

}
const fmtPeople = n => n == null ? "—" : (n >= 10000 ? (Math.round(n / 1000) / 10).toLocaleString("ko-KR") + "만 명" : n.toLocaleString("ko-KR") + "명");
const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const fmtDeg = (v, pos, neg) => Math.abs(v).toFixed(1) + "°" + (v >= 0 ? pos : neg);

const chip = iso => { const c = D.countries[iso]; return c ? '<button type="button" class="chip' + (c.tier === 1 ? " t1" : "") + '" data-iso="' + iso + '">' + esc(c.name_ko) + "</button>" : ""; };
function srcItem(s){
  const url = String(s).split(" ")[0], note = String(s).slice(url.length).trim();
  let host = url; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch(e){}
  return '<li><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(host) + "</a>" + (note ? " " + esc(note) : "") + "</li>";
}

/* ---------- load ---------- */
Promise.all([
  fetch("data/eurasia.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  fetch("data/world-50m.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
]).then(([d, w]) => init(d, w)).catch(err => {
  console.error(err);
  $("#loading").textContent = "데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.";
});

const PUB = () => !!(D && D.meta && D.meta.edition === "public");
function init(d, w){
  D = d;
  $("#asof").textContent = D.meta.asof; $("#ver").textContent = PUB() ? "" : D.meta.version;
  if (PUB()) { const tb = $("#tab-discuss"); if (tb) tb.remove(); const v = $("#ver"); if (v && v.previousSibling) v.previousSibling.textContent = v.previousSibling.textContent.replace(" · ", ""); }
  else { const b = document.createElement("span"); b.className = "edtag"; b.textContent = ""; $(".brand").appendChild(b); }
  const numToIso = {};
  for (const [iso, c] of Object.entries(D.countries)) if (c.num) numToIso[c.num] = iso;

  for (const f of features) { f.iso = numToIso[+f.id] || null; if (f.iso) byIso[f.iso] = f; }

  borders = topojson.mesh(w, w.objects.countries, (a, b) => a !== b);
  for (const iso of Object.keys(byIso)) labelPos[iso] = LABEL_AT[iso] || d3.geoCentroid(byIso[iso]);
  D.flashpoints.forEach((fp, i) => fp.phase = (i * 0.137) % 1);
  const addF = (iso, v) => { FOCUS[iso] = (FOCUS[iso] || 0) + v; };
  D.forecasts.forEach(f => f.countries.forEach(i => { addF(i, 1); FCN[i] = (FCN[i] || 0) + 1; }));
  D.flashpoints.forEach(fp => fp.countries.forEach(i => addF(i, 1)));
  (D.strategies || []).forEach(c => { (c.deciders ? c.deciders.items : []).forEach(d => addF(d.iso, 3)); const r = String(c.recipient || ""); addF(r.includes("우크라이나") ? "UKR" : r.includes("대만") ? "TWN" : "KOR", 3); });
  const fmx = Math.max(1, ...Object.values(FOCUS)); for (const k of Object.keys(FOCUS)) FOCUS[k] = Math.round(100 * Math.sqrt(FOCUS[k] / fmx));
  $("#loading").remove();
  readColors(); setupInteraction(); resize();
  new ResizeObserver(resize).observe(wrap);
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const retheme = () => { readColors(); renderLegend(); requestDraw(true); renderOverview(); renderGrand(); if (S.tab === "detail") renderDetail(); };
  mq.addEventListener ? mq.addEventListener("change", retheme) : mq.addListener(retheme);
  new MutationObserver(retheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  setLayer(S.layer);
  renderOverview(); renderDetail(); renderGrand(); renderDiscuss(); renderForecasts(); renderStrat(); renderMethod();
  const t = store.get("ep.tab"); if (t && t !== "detail") switchTab(t);
  applyHash(); HASH_READY = true;
  loop();
}

/* ---------- drawing ---------- */
function resize(){
  const r = wrap.getBoundingClientRect();
  W = r.width; H = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  for (const [c, ctx] of [[base, bctx], [over, octx]]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

}
function proj(){ projection.translate([W / 2, H / 2]).scale(R0 * S.k).rotate(S.rot); }
const center = () => { proj(); const c = projection.invert([W / 2, H / 2]); return (c && isFinite(c[0])) ? c : [-S.rot[0], -S.rot[1]]; };
/* versor: quaternion trackball rotation (after Mike Bostock's versor) */
const versor = (function(){
  const acos = Math.acos, asin = Math.asin, atan2 = Math.atan2, cos = Math.cos, sin = Math.sin, sqrt = Math.sqrt, max = Math.max, min = Math.min, rad = Math.PI / 180, deg = 180 / Math.PI;
  function v(e){ const l = e[0] / 2 * rad, sl = sin(l), cl = cos(l), p = e[1] / 2 * rad, sp = sin(p), cp = cos(p), g = (e[2] || 0) / 2 * rad, sg = sin(g), cg = cos(g);
    return [cl * cp * cg + sl * sp * sg, sl * cp * cg - cl * sp * sg, cl * sp * cg + sl * cp * sg, cl * cp * sg - sl * sp * cg]; }
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

function renderForecasts(){

  const set = on => { app.classList.toggle("wide", on); b.setAttribute("aria-pressed", on); b.title = on ? "기본 폭으로" : "읽기 영역 넓히기"; b.setAttribute("aria-label", b.title); store.set("ep.wide", on ? "1" : "0"); };
  set(store.get("ep.wide") === "1");
  b.onclick = () => set(!app.classList.contains("wide"));
})();

/* 위로 가기 */
const topBtn = document.getElementById("totop");
function updTop(){
  if (!topBtn) return;
  if (narrow()) { const p = document.getElementById("panel"); topBtn.hidden = !(scrollY > p.offsetTop + 900); }
  else { const a = document.getElementById("pane-" + S.tab); topBtn.hidden = !(a && a.scrollTop > 900); }
}
document.getElementById("panel").addEventListener("scroll", updTop, true);
addEventListener("scroll", updTop, {passive:true});
topBtn.onclick = () => {
  if (narrow()) document.getElementById("panel").scrollIntoView({block:"start"});
  else { const a = document.getElementById("pane-" + S.tab); if (a) a.scrollTop = 0; }
  updTop();
};

/* 주소 복사 */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy, old = b.textContent;
  const done = ok => { b.textContent = ok ? "복사했습니다" : "주소를 선택했습니다"; setTimeout(() => b.textContent = old, 1600); };
  const sel = () => { const m = b.parentElement.querySelector(".mail"); if (m) { const r = document.createRange(); r.selectNodeContents(m); const w = getSelection(); w.removeAllRanges(); w.addRange(r); } done(false); };
  try { navigator.clipboard.writeText(v).then(() => done(true), sel); } catch(e){ sel(); }
});
})();
</script>
