# 2026-11-21 대통령님 결재: 커밋할 때마다 바뀐 쪽 주소를 IndexNow(빙·네이버 등)로 알린다.
# 사이트맵에 있는 주소만 보낸다. 손으로 돌릴 때(Actions > IndexNow > Run workflow) all을 켜면 사이트맵 전체를 보낸다.
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "사이트맵의 모든 주소를 보냄"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitHub Pages 배포를 기다림
        if: github.event_name == 'push'
        run: sleep 150
      - name: 바뀐 쪽 주소를 알림
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ inputs.all }}
        run: python3 .github/indexnow.py
