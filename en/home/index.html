/* 판 열고 닫기 */
var OPEN=null;
function show(id,blur){ hide(); OPEN=id; $("dim").className="dim on"+(blur?" blur":""); $(id).classList.add("on"); if(id==="cc")$("gear").setAttribute("aria-expanded","true"); if(id==="sr")setTimeout(function(){$("sq").focus()},30); }
function hide(){ if(!OPEN)return; $(OPEN).classList.remove("on"); $("dim").className="dim"; $("gear").setAttribute("aria-expanded","false"); OPEN=null; }
$("gear").onclick=function(){ OPEN==="cc"?hide():show("cc"); };
$("fdb").onclick=function(){ show("fd",true); };
$("srb").onclick=function(){ show("sr"); };
$("dim").onclick=hide;
addEventListener("keydown",function(e){ if(e.key==="Escape")hide(); });
addEventListener("pageshow",function(e){ if(e.persisted)hide(); });
/* 설정: 사이트와 같은 저장값(ep.snd, ep.theme) */
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lab(){ var s=get("ep.snd")==="on", d=document.documentElement.dataset.theme==="dark";
  $("tsnd").setAttribute("aria-pressed",s); $("tsnd").querySelector("em").textContent=s?T.on:T.off;
  $("tth").setAttribute("aria-pressed",d); $("tth").querySelector("em").textContent=d?T.on:T.off; }
$("tsnd").onclick=function(){ set("ep.snd",get("ep.snd")==="on"?"off":"on"); lab(); };
$("tth").onclick=function(){ var t=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=t; set("ep.theme",t); lab(); };
lab();
/* 자료 */
var SRCH=APPS.filter(function(a){return a[1]}).concat(DK).map(function(a){return {t:a[0],u:P+a[1],k:T.pg}}).concat(CS.map(function(c){return {t:c[0],u:P+c[1],k:T.cs}}));
function kd(d){ var p=d.split("-"); return EN?new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))).replace(/^(Jan|Feb|Aug|Sep|Oct|Nov|Dec) /,function(m,a){return (a==="Sep"?"Sept":a)+". "}):(+p[1])+"월 "+(+p[2])+"일"; }
fetch(P+"/data/daily.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(D){
  var x=(D.issues||[])[0]; if(!x)return; var it=x.items||[];
  $("wbr").href=P+"/brief/"+x.date+"/"; $("wbd").textContent=kd(x.date)+" · "+T.n(it.length);
  $("wbl").innerHTML=it.slice(0,2).map(function(i){return "<li>"+esc(i.h)+"</li>"}).join("");
  var more=it.length-2+((x.more||[]).length); $("wbm").textContent=more>0?T.more(more):"";
  it.forEach(function(i){SRCH.push({t:i.h,u:P+"/brief/"+x.date+"/",k:kd(x.date)})});
}).catch(function(){ $("wbl").innerHTML="<li>"+T.fail+"</li>"; });
fetch(P+"/data/shell.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(S){
  var F={},open=[]; (S.forecasts||[]).forEach(function(f){F[f.id]=f; if(f.status==="open")open.push(f)});
  var seen={},ch=(S.fcr||[]).filter(function(c){ if(seen[c.id]||!F[c.id]||F[c.id].status!=="open"||c.from===c.to)return false; seen[c.id]=1; return true; });
  $("wfn").textContent=T.open(open.length);
  $("wfc").innerHTML=ch.slice(0,3).map(function(c){var up=c.to>c.from;return '<a href="'+P+'/forecast/'+c.id+'/"><span>'+esc(c.s)+'</span><span class="'+(up?"u":"d")+'"><i>'+c.from+"→</i>"+c.to+"%"+(up?"▲":"▼")+"</span></a>"}).join("");
  open.forEach(function(f){SRCH.push({t:f.s,u:P+"/forecast/"+f.id+"/",k:f.p+"%"})});
}).catch(function(){});
$("sq").oninput=function(){ var q=this.value.trim().toLowerCase(); if(!q){$("sl").innerHTML="";return}
  var r=SRCH.filter(function(s){return s.t.toLowerCase().indexOf(q)>=0}).slice(0,12);
  $("sl").innerHTML=r.length?r.map(function(s){return '<li><a href="'+s.u+'"><span>'+esc(s.t)+'</span><em>'+esc(s.k)+'</em></a></li>'}).join(""):'<li style="padding:10px 6px;font-size:13px;color:var(--ink2)">'+T.none+'</li>'; };
})();
</script>
</body>
</html>
