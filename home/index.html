var EDIT=false, G=$("apps"), DR=null, LP=null, SX=0, SY=0;

function base(el){ var t=el.style.transform; el.style.transform="none"; var r=el.getBoundingClientRect(); el.style.transform=t; return {x:r.left+r.width/2,y:r.top+r.height/2}; }
G.addEventListener("pointerdown",function(e){ var a=e.target.closest(".app"); if(!a)return; SX=e.clientX; SY=e.clientY;

G.addEventListener("pointermove",function(e){ if(LP&&(Math.abs(e.clientX-SX)>8||Math.abs(e.clientY-SY)>8)){clearTimeout(LP);LP=null}

  for(var i=0;i<kids.length;i++){ if(kids[i]===el)continue; var r=kids[i].getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){hit=kids[i];break} }
  if(hit){ var before=kids.indexOf(hit)<kids.indexOf(el); G.insertBefore(el,before?hit:hit.nextSibling); }
  var b=base(el); el.style.transform="translate("+(e.clientX-b.x)+"px,"+(e.clientY-b.y)+"px) scale(1.08)"; });
function drop(e){ clearTimeout(LP); LP=null; if(!DR)return; DR.el.classList.remove("drag"); DR.el.style.transform=""; DR=null; save(); }
