<style>
/* 2026-11-10 대통령님 승인: 휴대전화 첫 화면을 스마트폰 첫 화면처럼(위젯·앱·아래 고정 칸·설정 판) 꾸민 시제품. 검색 제외·메뉴 제외 */
:root{--acc:#1F4FD8;--ink:#101418;--ink2:#4A5560;--bg1:#F6F8FC;--bg2:#E7EDF7;--card:#fff;--soft:rgba(255,255,255,.75);--chip:#F1F4F9;--up:#0E8A4B;--dn:#C8102E;--dock:rgba(255,255,255,.66);--shade:0 2px 10px rgba(16,30,70,.07)}
:root[data-theme="dark"]{--acc:#6E95FF;--ink:#E8ECF2;--ink2:#A3ADB9;--bg1:#0E1320;--bg2:#141B2C;--card:#1B2336;--soft:rgba(27,35,54,.85);--chip:#253049;--up:#3CCB7F;--dn:#FF6B6B;--dock:rgba(27,35,54,.72);--shade:0 2px 10px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;color:var(--ink);word-break:keep-all}
a{color:inherit;text-decoration:none}
.wrap{max-width:430px;margin:0 auto;padding:0 0 120px;min-height:100vh;position:relative}
.lab{display:none}
@media (min-width:600px){body{background:#C9CFD8}:root[data-theme="dark"] body{background:#05070C}
  .lab{display:block;max-width:430px;margin:18px auto 10px;font-size:13px;line-height:1.5;color:#2F3842}
  :root[data-theme="dark"] .lab{color:#A3ADB9}
  .wrap{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);border-radius:36px;min-height:860px;margin-bottom:40px;box-shadow:0 0 0 9px #15181C,0 20px 40px rgba(0,0,0,.25);overflow:hidden}
  .dock{position:absolute!important}}
/* 상단 고정 줄 */
.sb{position:sticky;top:0;z-index:5;height:50px;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 14px 0 18px;background:linear-gradient(var(--bg1) 70%,transparent)}
.clk{display:flex;gap:13px;font:600 12px/1.1 "IBM Plex Mono",monospace}
.clk span{display:flex;flex-direction:column}.clk i{font:500 10px/1.25 "Pretendard Variable";font-style:normal;color:var(--ink2)}
.gear{width:34px;height:34px;border-radius:10px;border:0;background:var(--chip);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.gear svg{width:18px;height:18px}
.strip{margin:2px 12px 0;min-height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;gap:8px;padding:0 11px;font-size:12.5px;overflow:hidden;white-space:nowrap}
.strip b{flex:none;font-size:11px;color:#fff;background:#c2570c;border-radius:5px;padding:2px 6px}
.strip span{overflow:hidden;text-overflow:ellipsis}
/* 위젯 */
.wg{display:block;margin:10px 12px 0;background:var(--card);border-radius:22px;padding:13px 15px;box-shadow:var(--shade)}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:8px}
.wh b{font-size:13px;color:var(--acc)}.wh em{font:500 11px "IBM Plex Mono";font-style:normal;color:var(--ink2);white-space:nowrap}
.wb{margin:0;padding:0 0 0 14px}.wb li{font-size:13.5px;line-height:1.38;margin:0 0 5px;font-weight:600}.wb li::marker{color:var(--acc)}
.wmore{font-size:11.5px;color:var(--ink2);margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 0}
.row2 .wg{margin:0;min-height:150px;padding:12px 13px}
.fc a{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;margin:0 0 7px}
.fc a span:first-child{font-weight:600}
.fc a span:last-child{flex:none;font:600 11.5px "IBM Plex Mono"}
.u{color:var(--up)}.d{color:var(--dn)}
.hm{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}
.hm i{height:17px;border-radius:3px;display:block;background:var(--chip)}
.hm-n{margin-top:8px;font-size:11px;color:var(--ink2);line-height:1.35}
/* 앱 */
.apps{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;margin:18px 14px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.ic{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(16,30,70,.14);transition:transform .12s}
.app:active .ic{transform:scale(.92)}
.ic svg{width:32px;height:32px}
.app span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.15;white-space:nowrap}
.fold{background:var(--soft);display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:9px}
.fold i{width:12px;height:12px;border-radius:3.5px;display:block}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:406px;height:88px;border-radius:30px;background:var(--dock);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px;z-index:6}
.dock .app span{font-size:11px}
/* 판(설정·폴더·검색) */
.dim{position:fixed;inset:0;background:rgba(10,14,24,.42);z-index:10;display:none}
.dock{z-index:8!important}
.dim.on{display:block}
.dim.blur{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pane{position:fixed;z-index:11;display:none}
.pane.on{display:block}
.cc{top:56px;right:max(12px,calc(50% - 203px));width:262px;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.cc h4{margin:0 0 10px;font-size:13px;color:var(--ink2);font-weight:600}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg button{background:var(--chip);border:0;border-radius:14px;padding:10px;font:600 12.5px "Pretendard Variable";color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;text-align:left}
.tg svg{width:22px;height:22px}
.tg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.tg em{font-style:normal;font-weight:500;font-size:11px;opacity:.75}
.seg{margin-top:10px;display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg a{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:7px 0;border-radius:9px;color:var(--ink2)}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fd{left:50%;transform:translateX(-50%);top:22vh;width:min(330px,calc(100% - 48px));background:var(--card);border-radius:30px;padding:18px 16px 20px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.fd h4{margin:0 0 14px 4px;font-size:17px}
.fd .apps{grid-template-columns:repeat(3,1fr);margin:0;row-gap:16px}
.fd .app span{white-space:normal;max-width:88px}
.sr{left:50%;transform:translateX(-50%);top:56px;width:min(406px,calc(100% - 24px));background:var(--card);border-radius:22px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);max-height:70vh;overflow:auto}
.sr input{width:100%;height:40px;border-radius:12px;border:0;background:var(--chip);padding:0 12px;font:500 15px "Pretendard Variable";color:var(--ink);outline:none}
.sr ul{list-style:none;margin:8px 0 0;padding:0}
.sr li a{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid var(--chip);font-size:13.5px}
.sr li a em{font-style:normal;color:var(--ink2);font-size:12px;flex:none}
/* 앱 화면(2026-11-10 시제품): 쪽을 그대로 띄우고 머리글 대신 얇은 윗줄 */
.av{position:fixed;inset:0;z-index:7;background:var(--bg1);display:none;flex-direction:column}
.av.on{display:flex}
@media (min-width:600px){.av{left:50%;right:auto;width:430px;transform:translateX(-50%)}}
.ab{flex:none;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--chip)}
.ab button{height:34px;border:0;border-radius:10px;background:var(--chip);color:var(--ink);font:600 13px "Pretendard Variable";padding:0 11px;display:flex;align-items:center;gap:4px;cursor:pointer}
.ab b{font-size:15px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab svg{width:17px;height:17px}
.av iframe{flex:1;width:100%;border:0;background:var(--bg1)}
.sr .all{display:block;margin-top:10px;text-align:center;font-size:12.5px;color:var(--acc);font-weight:600}
</style>
</head>
<body>
<p class="lab">휴대전화 첫 화면 시제품입니다(검색 제외). 넓은 화면은 현재 구조를 그대로 두고, 휴대전화에서만 이렇게 바꾸는 안입니다.</p>

</div>

<div class="av" id="av" role="dialog" aria-labelledby="avt"><div class="ab"><button type="button" id="avh" aria-label="첫 화면으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>홈</button><b id="avt"></b><button type="button" id="avs" aria-label="검색 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5" stroke-linecap="round"/></svg></button></div><iframe id="avf" title="앱 화면"></iframe></div>

    <button type="button" id="tth" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg>밤 화면<em></em></button>
  </div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
/* 세계 시각 */
var CL=[["서울","Asia/Seoul"],["워싱턴","America/New_York"],["런던","Europe/London"],["키이우","Europe/Kyiv"]];
function tick(){ $("clk").innerHTML=CL.map(function(c){return "<span>"+new Intl.DateTimeFormat("en-GB",{timeZone:c[1],hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date())+"<i>"+c[0]+"</i></span>"}).join(""); }
tick(); setInterval(tick,20000);
/* 앱 */
var I={
 dig:['linear-gradient(145deg,#3B6CF0,#1F4FD8)','<rect x="7" y="6" width="18" height="21" rx="2"/><path d="M11 12h10M11 16h10M11 20h6"/>'],
 feat:['linear-gradient(145deg,#2B3A55,#101418)','<path d="M8 25V9l8-3 8 3v16"/><path d="M12 14h8M12 18h8"/>'],
 ind:['linear-gradient(145deg,#12A57A,#0E7A5B)','<path d="M6 25h20M9 25V15l5 3v-6l5 3v-6l5 3v13"/>'],
 grand:['linear-gradient(145deg,#5A3FC8,#3B2A8E)','<circle cx="16" cy="16" r="10"/><path d="M6 16h20M16 6c3 3 4.5 6.5 4.5 10S19 23 16 26c-3-3-4.5-6.5-4.5-10S13 9 16 6z"/>'],
 ideas:['linear-gradient(145deg,#B9854A,#8A5A2B)','<path d="M7 8h7a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H7zM25 8h-7a3 3 0 0 0-3 3"/><path d="M25 8v16h-8"/>'],
 acad:['linear-gradient(145deg,#2E5BE0,#0B2A86)','<path d="M4 13l12-6 12 6-12 6z"/><path d="M9 16v6c4 3 10 3 14 0v-6"/>'],
 game:['linear-gradient(145deg,#6B6B6B,#2E2E2E)','<path d="M10 26h12M12 26v-4l-2-9h12l-2 9v4M13 13V8h6v5"/>'],
 start:['linear-gradient(145deg,#F08A3C,#c2570c)','<circle cx="16" cy="16" r="10"/><path d="M16 14.5v7M16 10.5v.5" stroke-linecap="round"/>'],
 sub:['linear-gradient(145deg,#4E5A66,#2F3842)','<rect x="6" y="9" width="20" height="14" rx="2"/><path d="M6 11l10 7 10-7"/>']};
function ic(k){var a=I[k];return '<span class="ic" style="background:'+a[0]+'"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2">'+a[1]+'</svg></span>'}
var HM='<span class="ic" style="background:linear-gradient(145deg,#F2F4F8,#DDE3EC)"><svg viewBox="0 0 32 32"><rect x="5" y="6" width="9" height="8" rx="1.5" fill="#C8102E"/><rect x="15.5" y="6" width="11.5" height="8" rx="1.5" fill="#F59E0B"/><rect x="5" y="15.5" width="13" height="10" rx="1.5" fill="#1F4FD8"/><rect x="19.5" y="15.5" width="7.5" height="10" rx="1.5" fill="#0EA5A4"/></svg></span>';
var NR='<span class="ic" style="background:linear-gradient(145deg,#1A2140,#0A0E1A)"><svg viewBox="0 0 32 32" fill="none" stroke="#7FA3FF" stroke-width="1.6"><path d="M8 9l8 7 8-7M8 23l8-7 8 7M8 9v14M24 9v14"/><g fill="#fff" stroke="none"><circle cx="8" cy="9" r="2.4"/><circle cx="24" cy="9" r="2.4"/><circle cx="16" cy="16" r="2.8"/><circle cx="8" cy="23" r="2.4"/><circle cx="24" cy="23" r="2.4"/></g></svg></span>';
var CS=[["한반도","/case/korea/","#1F4FD8"],["대만해협","/case/taiwan/","#0EA5A4"],["러-우 전쟁","/case/ukraine/","#F59E0B"],["이란·호르무즈","/case/iran/","#C8102E"],["러시아-NATO 대치","/case/poland/","#6B4FD8"],["전략과 전개 전체","/case/","#4E5A66"]];
var FOLD='<span class="ic fold">'+CS.map(function(c){return '<i style="background:'+c[2]+'"></i>'}).join("")+'</span>';

$("fda").innerHTML=CS.map(function(c){return '<a class="app" href="'+c[1]+'"><span class="ic" style="background:'+c[2]+'"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><circle cx="16" cy="14" r="5"/><path d="M16 19v7"/></svg></span><span>'+c[0]+'</span></a>'}).join("");
/* 판 열고 닫기 */
var OPEN=null;
function show(id,blur){ hide(); OPEN=id; $("dim").className="dim on"+(blur?" blur":""); $(id).classList.add("on"); if(id==="cc")$("gear").setAttribute("aria-expanded","true"); if(id==="sr")setTimeout(function(){$("sq").focus()},30); }

addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(OPEN)hide(); else if($("av").classList.contains("on"))avClose(); } });
/* 설정: 사이트와 같은 저장값(ep.snd, ep.theme)을 쓴다 */
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lab(){ var s=get("ep.snd")==="on", d=document.documentElement.dataset.theme==="dark";
  $("tsnd").setAttribute("aria-pressed",s); $("tsnd").querySelector("em").textContent=s?"켜짐":"꺼짐";
  $("tth").setAttribute("aria-pressed",d); $("tth").querySelector("em").textContent=d?"켜짐":"꺼짐"; }
$("tsnd").onclick=function(){ set("ep.snd",get("ep.snd")==="on"?"off":"on"); lab(); };
$("tth").onclick=function(){ var t=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=t; set("ep.theme",t); lab(); };
lab();
/* 자료 */
var SRCH=APPS.filter(function(a){return a[1]}).map(function(a){return {t:a[0],u:a[1],k:"화면"}}).concat(CS.map(function(c){return {t:c[0],u:c[1],k:"사안"}}));
function kd(d){var p=d.split("-");return (+p[1])+"월 "+(+p[2])+"일"}
fetch("/data/daily.json").then(function(r){return r.json()}).then(function(D){
  var x=(D.issues||[])[0]; if(!x)return; var it=x.items||[];
  $("wbr").href="/brief/"+x.date+"/"; $("wbd").textContent=kd(x.date)+" · "+it.length+"건";
  $("wbl").innerHTML=it.slice(0,3).map(function(i){return "<li>"+esc(i.h)+"</li>"}).join("");
  var more=it.length-3+((x.more||[]).length); $("wbm").textContent=more>0?"그 밖에 "+more+"건 더 보기":"";
  it.forEach(function(i){SRCH.push({t:i.h,u:"/brief/"+x.date+"/",k:kd(x.date)})});
}).catch(function(){ $("wbl").innerHTML="<li>브리핑을 불러오지 못했습니다</li>"; });
fetch("/data/shell.json").then(function(r){return r.json()}).then(function(S){
  var F={},open=[]; (S.forecasts||[]).forEach(function(f){F[f.id]=f; if(f.status==="open")open.push(f)});
  var seen={},ch=(S.fcr||[]).filter(function(c){ if(seen[c.id]||!F[c.id]||F[c.id].status!=="open")return false; seen[c.id]=1; return true; });
  if(ch[0]){ var c=ch[0]; $("strip").href="/forecast/"+c.id+"/"; $("strip").querySelector("span").textContent=c.s+" "+c.from+"→"+c.to+"%"; }
  $("wfc").innerHTML=ch.slice(0,3).map(function(c){var up=c.to>c.from;return '<a href="/forecast/'+c.id+'/"><span>'+esc(c.s)+'</span><span class="'+(up?"u":"d")+'">'+c.to+"%"+(up?"▲":"▼")+"</span></a>"}).join("");
  var mv=open.filter(function(f){return f.p0!=null&&f.p!==f.p0}), byM=open.slice().sort(function(a,b){return Math.abs(b.p-(b.p0==null?b.p:b.p0))-Math.abs(a.p-(a.p0==null?a.p:a.p0))});
  $("whn").textContent=open.length+"건"; $("hmn").textContent="처음보다 확률이 바뀐 전망 "+mv.length+"건";
  $("hm").innerHTML=byM.slice(0,24).map(function(f){var d=f.p-(f.p0==null?f.p:f.p0),a=Math.min(1,.25+Math.abs(d)/25);return '<i style="'+(d?"background:"+(d>0?"rgba(14,138,75,"+a+")":"rgba(200,16,46,"+a+")"):"")+'"></i>'}).join("");
  open.forEach(function(f){SRCH.push({t:f.s,u:"/forecast/"+f.id+"/",k:f.p+"%"})});
}).catch(function(){});
/* 앱 화면 시제품: 정세 브리핑·히트맵·한반도 3개만 앱 화면으로 연다(나머지는 종전처럼 그 쪽으로 간다) */
var AV={brief:["정세 브리핑","/brief/","html:not(.locshow) #wrap{display:none!important}html.locshow #wrap{position:fixed!important;left:0;right:0;top:0;height:48vh!important;z-index:60;margin:0!important;border-radius:0 0 18px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28)}#locx{display:none;position:fixed;z-index:61;top:12px;left:50%;transform:translateX(-50%);height:34px;padding:0 12px;border:0;border-radius:10px;background:rgba(16,20,24,.78);color:#fff;font:600 13px Pretendard Variable,sans-serif}html.locshow #locx{display:block}",1],heat:["히트맵","/lab/heatmap/?embed=1",""],korea:["한반도","/case/korea/",""]};  /* 셋째 값: 그 앱 화면에서만 더 숨길 것(정세 브리핑은 지구본을 숨겨 글이 바로 보이게) */
var CUR=null;
var CSS='header.hd,#hdr,.hd-strips{display:none!important}body{padding-bottom:110px!important}';
function avOpen(k,u,push){ var a=AV[k]; if(!a)return false; hide(); CUR=a; $("avt").textContent=a[0]; var o=$("avf"), f=document.createElement("iframe"); f.id="avf"; f.title=a[0]; f.src=u||a[1]; f.addEventListener("load",inj); o.parentNode.replaceChild(f,o); $("av").classList.add("on"); document.body.style.overflow="hidden"; return true; }
/* 시제품에서는 앱 화면을 첫 화면 위에 띄우므로 '← 홈'으로 닫는다(실제 적용 때는 쪽마다 주소가 있어 뒤로 가기도 된다) */
function avClose(){ $("av").classList.remove("on"); var o=$("avf"), f=document.createElement("iframe"); f.id="avf"; f.title="앱 화면"; o.parentNode.replaceChild(f,o); document.body.style.overflow=""; }
function inj(){ try{ var d=this.contentDocument, w=this.contentWindow; if(!d||!d.head)return; var st=d.createElement("style"); st.textContent=CSS+(CUR&&CUR[2]||""); d.head.appendChild(st);
  /* 정세 브리핑 앱: 꼭지의 장소(제목 옆 표시)를 누를 때만 지구본이 위에서 내려오고, '지도 닫기'로 접는다 */
  if(CUR&&CUR[3]){ var x=d.createElement("button"); x.type="button"; x.id="locx"; x.textContent="지도 닫기"; d.body.appendChild(x);
    x.addEventListener("click",function(){ d.documentElement.classList.remove("locshow"); });
    d.addEventListener("click",function(e){ if(e.target.closest&&e.target.closest(".bh[data-bloc],.bh[data-dg]")){ if(!d.documentElement.classList.contains("locshow")){ d.documentElement.classList.add("locshow"); try{ w.dispatchEvent(new w.Event("resize")) }catch(_){} } } },true); }
}catch(e){} }
$("avh").onclick=avClose;
$("avs").onclick=function(){ show("sr"); };
function hook(sel,k,uf){ document.querySelectorAll(sel).forEach(function(el){ el.addEventListener("click",function(ev){ if(ev.metaKey||ev.ctrlKey)return; ev.preventDefault(); avOpen(k,uf?uf(el):null); }); }); }
hook('.dock a[href="/brief/"]',"brief"); hook('#wbr',"brief",function(el){return el.getAttribute("href")}); hook('.apps a[href="/heatmap/"], .row2 a[href="/heatmap/"]',"heat"); hook('#fda a[href="/case/korea/"]',"korea");
if(location.hash&&AV[location.hash.slice(1)]) avOpen(location.hash.slice(1));
/* 검색: 화면 이름·사안·진행 중인 전망·오늘의 꼭지 */
$("sq").oninput=function(){ var q=this.value.trim(); if(!q){$("sl").innerHTML="";return}
  var r=SRCH.filter(function(s){return s.t.indexOf(q)>=0}).slice(0,12);
  $("sl").innerHTML=r.length?r.map(function(s){return '<li><a href="'+s.u+'"><span>'+esc(s.t)+'</span><em>'+esc(s.k)+'</em></a></li>'}).join(""):'<li style="padding:10px 6px;font-size:13px;color:var(--ink2)">찾은 것이 없습니다</li>'; };
})();
</script>
