</style></head><body><div class="wrap" id="v"></div>
<script>
(function(){
var DATA=null,V=document.getElementById('v');
function ls(k,d){try{var x=localStorage.getItem('clisa.'+k);return x==null?d:JSON.parse(x)}catch(e){return d}}
function ss(k,v){try{localStorage.setItem('clisa.'+k,JSON.stringify(v))}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function md(d){var p=d.split('-');return (+p[1])+'월 '+(+p[2])+'일'}
function app(id){for(var i=0;i<DATA.apps.length;i++)if(DATA.apps[i][0]===id)return DATA.apps[i]}
function reg(id){for(var i=0;i<DATA.regions.length;i++)if(DATA.regions[i][0]===id)return DATA.regions[i]}
// 읽음: 앱마다 따로(문자 앱처럼). 처음 쓰는 날에는 최근 2회분 브리핑만 '새 소식'
function start(){var s=ls('start',null);if(!s){var ds=[];DATA.items.forEach(function(x){if(ds.indexOf(x.d)<0)ds.push(x.d)});s=ds[Math.min(1,ds.length-1)];ss('start',s)}return s}
function seen(k){return ls('seen.'+k,[])}
function unread(k,list){var st=start(),sn=seen(k);return list.filter(function(x){return x.d>=st&&sn.indexOf(x.id)<0})}
function markRead(k,list){var sn=seen(k);list.forEach(function(x){if(sn.indexOf(x.id)<0)sn.push(x.id)});ss('seen.'+k,sn.slice(-600))}
function issueItems(id){return DATA.items.filter(function(x){return x.a.indexOf(id)>=0})}
function regItems(id){return DATA.items.filter(function(x){return x.r===id})}
function fcLast(f){return f.h.length?f.h[f.h.length-1][0]:''}
function fcChanged(){var since=ls('fcseen',null);if(!since){var d=new Date(DATA.asof);d.setDate(d.getDate()-3);since=d.toISOString().slice(0,10);ss('fcseen',since)}
  return DATA.fc.filter(function(f){return f.h.length>1&&fcLast(f)>since})}
function thinker(id){var T=DATA.thinkers||[];for(var i=0;i<T.length;i++)if(T[i].id===id)return T[i]}
function tilt(id){var b=(DATA.boards||{})[id];if(!b)return null;var m=null;b.fut.forEach(function(f){if(f.v&&(!m||Math.abs(f.v)>Math.abs(m.v)))m=f});return m}
function draft(){return location.search.indexOf('draft')>=0||location.pathname.indexOf('/lab/app/')===0}
// 매일 브리핑 소식의 pull 표시([[사안, "L"|"R", 힘 이름], ...])를 세어 힘에 '오늘 +n' 불을 켠다
function pulls(id,side,name){var t=0,w=0,wk=new Date(DATA.asof);wk.setDate(wk.getDate()-6);wk=wk.toISOString().slice(0,10);
  (DATA.items||[]).forEach(function(x){(x.pull||[]).forEach(function(p){if(p[0]===id&&p[1]===side&&p[2]===name){if(x.d===DATA.asof)t++;if(x.d>=wk)w++}})});return {today:t,week:w}}
function badge(n){return n>0?'<span class="bd">'+(n>99?'99+':n)+'</span>':''}
function delta(f){if(f.h.length<2)return '';var a=f.h[f.h.length-2][1],b=f.h[f.h.length-1][1];if(a===b)return '';return '<small class="'+(b>a?'up':'dn')+'">'+(b>a?'▲':'▼')+Math.abs(b-a)+' · '+md(f.h[f.h.length-1][0])+'</small>'}
function fpById(id){for(var i=0;i<DATA.fc.length;i++)if(DATA.fc[i].id===id)return DATA.fc[i]}

function home(){
  var latest=DATA.items.filter(function(x){return x.d===DATA.asof}).slice(0,3);
  var dg=DATA.digest[0];
  var h='<header class="top"><img src="/lab/app/app-192.png" alt=""><span class="nm">클리사</span></header>';
  var W=DATA.world,TC=['#2F5DA8','#5B6475','#B4441F','#7A3FA0','#A0782A'];
  var F0=favs(),reads=DATA.apps.slice().sort(function(a,b){return (F0.indexOf('i:'+b[0])>=0)-(F0.indexOf('i:'+a[0])>=0)}).map(function(a){var C=((DATA.boards||{})[a[0]]||{}).cur;return C&&C.short&&(C.ok||draft())?[a[1],C.short,C.ok]:null}).filter(Boolean);
  h+='<section class="wk"><div class="q">오늘 세계에서 무엇이 어느 쪽으로 움직였나</div><h2>이번 주 세계</h2>';
  h+=reads.length?'<ul class="wkl">'+reads.map(function(r){return '<li><b>'+e(r[0])+'</b><span>'+e(r[1])+'으로</span></li>'}).join('')+'</ul>'+(reads.some(function(r){return !r[2]})?'<span class="draft" style="margin:0">결재 전 시안</span>':''):'<p>이번 주 판의 읽기는 매주 월요일에 고칩니다.</p>';
  if(W){h+='<div class="wfold"><button class="more2" data-fold style="padding:0">세계의 앞날 5가지와 그 틀 ('+md(W.asof)+' 판단) ▾</button><div class="fold" hidden>'+W.scen.map(function(x,i){var t=thinker(x[3]);return '<a class="wr" href="#lens"><span class="wn"><b>'+e(x[1])+'</b><small>'+e(t?t.n+'의 틀':'')+'</small></span><span class="wbar"><i style="width:'+(x[2]/W.scen[0][2]*100)+'%;background:'+TC[i%5]+'"></i></span><b class="wp">'+x[2]+'%</b></a>'}).join('')+
    (W.trends[0]?'<div class="wtr"><b>큰 흐름 · </b>'+e(W.trends.slice(0,3).map(function(x){return x[0]}).join(' / '))+'</div>':'')+'</div></div>'}
  h+='</section>';
  var wg='<section class="widget" style="margin-top:14px"><div class="q w">무슨 일이 있었나 · 오늘의 정세 브리핑</div><div class="k">'+md(DATA.asof)+' 정세 브리핑</div>';
  if(dg)wg+='<div class="flow"><b>이번 주 흐름</b> · '+e(dg.t)+'</div>';
  wg+='<ul>'+latest.map(function(x){var a=app(x.a[0]);return '<li data-item="'+x.id+'" data-app="'+x.a[0]+'"><span class="tg">'+e(a[2])+'</span><span>'+e(x.h)+'</span></li>'}).join('')+'</ul>';
  wg+='<a class="more" href="/brief/'+DATA.asof+'/">정세 브리핑 전체 보기 ›</a></section>';
  var mode=ls('mode','issue');if(mode!=='issue'&&mode!=='region')mode='issue';
  var F=favs(),P=prof();
  if(draft()){if(P&&F.length)h+='<div class="pf">관심: '+e(F.map(function(k){var x=k[0]==='i'?app(k.slice(2)):reg(k.slice(2));return x?x[1]:''}).filter(Boolean).join(' · '))+'<a href="#start/1">관심사 바꾸기</a></div>';
    else h+='<div class="pf">'+(P?'모든 사안을 같은 순서로 보여 드립니다.':'관심 있는 사안을 고르면 첫 화면을 그에 맞춰 드립니다.')+'<a href="#start/1">'+(P?'관심사 바꾸기':'고르기')+'</a></div>'}
  var ord=function(L,pre){return L.slice().sort(function(a,b){return (F.indexOf(pre+b[0])>=0)-(F.indexOf(pre+a[0])>=0)})};
  h+='<div class="seg"><button data-mode="issue" class="'+(mode==='issue'?'on':'')+'">사안별</button><button data-mode="region" class="'+(mode==='region'?'on':'')+'">지역별</button></div>';
  if(mode==='issue'){
    h+='<div class="cards">'+ord(DATA.apps,'i:').map(function(a){var n=unread('i.'+a[0],issueItems(a[0])).length,B=(DATA.boards||{})[a[0]],C=B&&B.cur,ok=C&&C.kn!=null&&(C.ok||draft()),body='';
      if(ok)body='<div class="mini"><div class="ln"></div>'+(Math.abs(C.kn-C.kn0)>=1?'<div class="k0" style="left:'+C.kn0+'%"></div>':'')+'<div class="k" style="left:'+C.kn+'%"></div></div><div class="rd"><b>이번 주</b> '+e(C.short)+(C.ok?'':' <span class="draft">시안</span>')+'</div>';
      else{var tl=tilt(a[0]);if(tl)body='<div class="rd"><b>이번 주 전망 신호</b> '+(tl.v>0?'↗ ':'↘ ')+e(tl.n)+(tl.v>0?' 쪽':'에서 멀어짐')+'</div>';else{var it=issueItems(a[0])[0];if(it)body='<div class="rd">'+e(it.h)+'</div>'}}
      return '<button class="pc'+(F.indexOf('i:'+a[0])>=0?' fav':'')+'" style="--acc2:'+a[3]+'" data-open="i:'+a[0]+'"><div class="hd"><span class="ic2" style="background:'+a[3]+'">'+e(a[2])+'</span><span class="nm2">'+e(a[1])+'</span></div>'+body+badge(n)+'</button>'}).join('')+'</div>'+wg+'<div class="grid" style="margin-top:18px">';
  }else{h+=wg+'<div class="grid" style="margin-top:14px">';
    ord(DATA.regions,'r:').forEach(function(r){var n=unread('r.'+r[0],regItems(r[0])).length;
      h+='<button class="ap" data-open="r:'+r[0]+'"><span class="ic" style="background:'+r[3]+';font-size:'+(r[2].length>3?12:15)+'px">'+e(r[2])+'</span><span class="lb">'+e(r[1])+'</span>'+badge(n)+'</button>'});
  }
  h+='<button class="ap" data-open="fc"><span class="ic" style="background:#0B2A86">전망</span><span class="lb">바뀐 전망</span>'+badge(fcChanged().length)+'</button>';
  h+='<button class="ap" data-open="lens"><span class="ic" style="background:#6B4E2E">틀</span><span class="lb">세계를 보는 틀</span></button>';
  h+='<button class="ap" data-open="dg"><span class="ic" style="background:#2C3E66">요약</span><span class="lb">주간 정세 요약</span></button>';
  h+='<button class="ap" data-open="msg"><span class="ic" style="background:#3D5A80">의견</span><span class="lb">운영자에게 보내기</span></button></div>';
  if(draft()&&'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window)h+='<section class="card nt" id="nt"></section>';
  h+='<p class="note">시험판입니다. 내용은 클리사 지오폴리틱스의 공개 자료(정세 브리핑·정세 요약·전망)를 그대로 보여 줍니다. <a href="/">클리사 지오폴리틱스로 가기</a></p>';
  V.innerHTML=h;window.scrollTo(0,0);ntCard();
}
function bar(ic,col,t){return '<div class="bar"><button data-go="home" aria-label="뒤로">‹</button><span class="ic" style="background:'+col+'">'+e(ic)+'</span><h1>'+e(t)+'</h1></div>'}
function msgs(list,key,hl){
  var st=start(),sn=seen(key),h='',last='';
  if(!list.length)return '<p class="empty">최근 3주 동안의 소식이 없습니다.</p>';
  list.forEach(function(x){if(x.d!==last){h+='<div class="day"><span>'+md(x.d)+'</span></div>';last=x.d}
    var nw=x.d>=st&&sn.indexOf(x.id)<0;
    h+='<div class="msg'+(nw?' nw':'')+(x.id===hl?' hl':'')+'" id="m-'+x.id+'"><div class="h">'+e(x.h)+'</div><div class="t clamp">'+e(x.t)+'</div><button class="mo" data-more>더 보기</button><div class="mt">';
    x.fc.forEach(function(c){var f=fpById(c[0]);if(f)h+='<a class="chip" href="/forecast/'+c[0]+'/">'+e(f.q.length>22?f.q.slice(0,22)+'…':f.q)+' '+f.p+'%'+(c[1]==='up'?' ↑':c[1]==='down'?' ↓':'')+'</a>'});
    if(x.pl)h+='<span class="chip">'+e(x.pl)+'</span>';
    if(x.s[0])h+='<a class="src" href="'+e(x.s[0])+'" target="_blank" rel="noopener">출처</a>';
    h+='</div></div>'});
  return h;
}
function fcList(list,limit){
  list=list.slice().sort(function(a,b){return fcLast(b)<fcLast(a)?-1:fcLast(b)>fcLast(a)?1:0});
  var h=list.slice(0,limit).map(function(f){return '<a class="fc" href="/forecast/'+f.id+'/"><span class="q">'+e(f.q)+'</span><span class="pv"><b>'+f.p+'%</b>'+delta(f)+'</span></a>'}).join('');
  return h||'<p class="empty">연결된 전망이 없습니다.</p>';
}
function issue(id,arg){
  var a=app(id),list=issueItems(id),key='i.'+id,B=(DATA.boards||{})[id],C=B?B.cur:{},cok=!!(C&&(C.ok||draft())&&C.L),dl=C&&!C.ok?'<span class="draft">결재 전 시안</span>':'';
  var I=impOf(id),TB={news:1,fc:1,pan:1,imp:1};
  var tab=TB[arg]?arg:(arg?'news':(wantTab(id)||(B?'pan':'news'))),hl=(arg&&!TB[arg])?arg:null;if(tab==='imp'&&!I)tab='news';if(tab==='pan'&&!B)tab='news';
  var h=bar(a[2],a[3],a[1]),q=location.search||'';
  var tb=[];if(B)tb.push(['pan','판세']);if(I)tb.push(['imp','영향']);tb.push(['news','소식']);tb.push(['fc','전망']);
  var L2=function(t){return q+'#i/'+id+'/'+t};
  h+='<div class="tabs">'+tb.map(function(t){return '<a href="'+q+'#i/'+id+'/'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+(t[0]==='news'?(function(){var n=unread(key,list).length;return n?' '+n:''})():'')+'</a>'}).join('')+'</div>';
  if(tab==='pan'){
    h+='<div class="q">이 판은 어디로 가고 있고, 왜 그런가</div>';
    if(cok)h+='<div class="asof2">'+md(C.asof)+' 기준 · 매주 월요일 고침 · 클리사 지오폴리틱스의 판단</div>';
    if(cok){
      // 화살머리는 몸통 굵기에 맞춰 커진다(몸통의 2배 높이, 최소 14px)
      var side=function(L,c){return L.map(function(f){var t=Math.round(3+f[2]*1.2),hh=Math.max(14,t*2),hw=Math.round(hh*0.75),col=c==='g'?'var(--dn)':'var(--up)',
        hd=c==='g'?'<svg width="'+hw+'" height="'+hh+'" viewBox="0 0 10 10" preserveAspectRatio="none"><path d="M0 5 L10 0 L8 5 L10 10 Z" fill="'+col+'"/></svg>':'<svg width="'+hw+'" height="'+hh+'" viewBox="0 0 10 10" preserveAspectRatio="none"><path d="M10 5 L0 0 L2 5 L0 10 Z" fill="'+col+'"/></svg>';
        var n=pulls(id,c==='g'?'L':'R',f[0]);
        return '<div class="fz '+c+'"><div class="arw '+c+'">'+(c==='g'?hd:'')+'<i style="height:'+t+'px"></i>'+(c==='r'?hd:'')+'</div><b>'+e(f[0])+'<span class="pw">힘 '+f[2]+'</span>'+(n.today?'<span class="td">오늘 +'+n.today+'</span>':n.week?'<span class="td" style="background:var(--mut)">이번 주 +'+n.week+'</span>':'')+'</b><span>'+e(f[1])+'</span></div>'}).join('')};
      h+='<div class="card tug"><h2>판을 당기는 힘'+dl+'</h2><div class="cols"><div><div class="ch g">← '+e(C.left)+'</div>'+side(C.L,'g')+'</div><div><div class="ch r">'+e(C.right)+' →</div>'+side(C.R,'r')+'</div></div>';
      h+='<div class="rope" style="--pull:'+((C.kn-50)*3)+'px"><div class="ln"></div><div class="ctr"></div>'+(Math.abs(C.kn-C.kn0)>=1?'<div class="k0" style="left:'+C.kn0+'%"></div>':'')+'<div class="k" style="left:'+C.kn+'%"></div></div>';
      h+='<div class="band">'+C.bands.map(function(x){return '<div class="'+x[2]+'" style="flex:'+Math.max(x[1],8)+'">'+e(x[0])+'<br>'+x[1]+'%</div>'}).join('')+'</div>';
      h+='<div class="cap">매듭 = '+(B.horizon||'')+'년까지 전개별 확률(클리사 지오폴리틱스 사안 분석)의 무게중심'+(Math.abs(C.kn-C.kn0)>=1?' · 흐린 매듭은 지난주':' · 지난주와 같은 자리')+'<br>'+e(C.cap)+' · 화살표 굵기는 클리사의 판단</div>';
      h+='<button class="more2" data-fold>전개 '+B.fut.length+'가지 자세히 ▾</button><div class="fold" hidden>'+futs(B)+'</div>';
      h+='<div class="why"><b>매듭이 풀리지 않는 이유</b>'+e(C.why)+'</div></div>';
      h+='<div class="card"><h2>이번 주 판이 기운 쪽'+dl+'</h2><div class="read2">'+e(C.reading)+'</div>'+evid(B)+'</div>';
      if(C.changes)h+='<div class="card"><h2>이번 주 달라진 힘'+dl+'</h2><ul class="chg2">'+C.changes.map(function(x){return '<li>'+e(x)+'</li>'}).join('')+'</ul></div>';
      if(C.forces)h+='<div class="card"><h2>판을 움직이는 힘'+dl+'</h2>'+C.forces.map(function(f){return '<div class="ac"><b>'+e(f[0])+'</b><p>'+e(f[1])+'</p></div>'}).join('')+'</div>';
      if(C.clash)h+='<div class="card clash"><h2 style="color:#C2410C">부딪히는 지점'+dl+'</h2><p>'+e(C.clash)+'</p></div>';
    }else{
      h+='<div class="card"><h2>판이 기우는 방향 · '+(B.horizon||'')+'년까지 전개별 확률</h2>'+futs(B)+evid(B)+'</div>';
    }
    var acts=cok&&C.actors?C.actors:B.acts;
    h+='<div class="card"><h2>각자 원하는 것과 물러설 수 없는 선'+(cok&&C.actors?dl:'')+'</h2>'+acts.map(function(x){return '<div class="ac"><b>'+e(x[0])+'</b><p><span class="tg2 tw">원하는 것</span>'+e(x[1])+'</p><p><span class="tg2 tr">물러설 수 없는 선</span>'+e(x[2])+'</p></div>'}).join('')+(cok&&C.note?'<p class="note" style="margin-top:8px">'+e(C.note)+'</p>':'')+'</div>';
    if(cok&&C.lenses){h+='<div class="card"><h2>이 판을 보는 틀 · 역사와 사상'+dl+'</h2>'+C.lenses.map(function(x){return '<div class="ls"><div class="ln">'+e(x[0])+'<span class="lt">'+e(x[1])+'</span></div><p><span class="tg2 k1">이렇게 보면</span>'+e(x[3])+'</p><p><span class="tg2 k2">들어맞는 점</span>'+e(x[4])+'</p><p><span class="tg2 k3">어긋나는 점</span>'+e(x[5])+'</p><p><span class="tg2 k4">이 틀이 맞다면</span>'+e(x[6])+'</p></div>'}).join('')+(C.lean?'<div class="lean">'+e(C.lean)+'</div>':'')+
      '<div class="ac" style="margin-top:6px"><b>이번 주는 어느 틀이 맞았나</b><p>'+((C.score&&C.score.length)?C.score.map(function(x){return e(x)}).join('<br>'):'매주 월요일 점검에서 한 줄씩 기록합니다. 첫 기록은 11월 16일 주간 점검입니다.')+'</p></div></div>'}
